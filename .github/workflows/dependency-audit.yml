name: Dependency audit

# Standing advisory check, independent of the deploy.
#
# Before this existed, npm audit ran only inside deploy.yml, which fires on
# push to main. Between pushes nothing looked at the dependency tree. A
# critical Next.js RCE sat in the advisory database for ten quiet days and
# surfaced as a red deploy rather than as a notification, taking the live
# site down with it for a week.
#
# This job separates the two questions. "Is the tree safe" is asked every
# Monday whether or not anyone pushed. "Does this commit ship" stays in
# deploy.yml. A failure here notifies the repository owner without blocking
# a release, so an advisory reaches a human before it reaches the gate.
#
# Runs an hour before the CodeQL sweep so both weekly signals land together.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Audit dependency tree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Mirrors deploy.yml. A package-lock.json generated on Windows omits
        # the Linux-only optional native binaries, per npm issue 4828.
        run: |
          npm ci --include=optional
          npm install --no-save --include=optional --force lightningcss-linux-x64-gnu @img/sharp-linux-x64 @tailwindcss/oxide-linux-x64-gnu @tailwindcss/oxide-linux-x64-musl

      - name: Audit production tree
        # Same threshold as the blocking gate in deploy.yml. A failure here
        # means the next push to main fails its deploy, so treat it as the
        # early warning for exactly that.
        run: npm audit --audit-level=moderate --omit=dev

      - name: Audit full tree including dev
        # Advisory. Dev-only findings never block a release, and they still
        # need a human to see them.
        if: always()
        run: npm audit --audit-level=moderate || echo "dev advisories noted, non-blocking"

      - name: Report
        if: failure()
        run: |
          echo "::warning::Production dependency tree carries an advisory at moderate or above."
          echo "The next push to main will fail its deploy at the blocking audit step."
          echo "Run 'npm audit --omit=dev' locally to see the tree, and check whether"
          echo "the fix needs a package.json bump or an entry in the overrides block."
