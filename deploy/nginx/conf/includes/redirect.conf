# Emit relative redirects. cloud.gov terminates TLS at the router, so nginx
# sees http internally. With the default absolute_redirect on, nginx builds the
# trailing-slash directory redirect as http://host/path/, downgrading https and
# breaking every non-root route. Relative redirects keep the client's scheme.
# Ref: cloudfoundry/staticfile-buildpack issue #137.
absolute_redirect off;
port_in_redirect off;
