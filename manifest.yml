# Cloud.gov deployment manifest.
# Serves the static export through the staticfile buildpack.
# Build with: node scripts/build-cloudgov.mjs  (or npm run build:cloudgov)
# The script stages out/ as the deploy bundle: the exported site under out/public,
# the nginx config under out/nginx, and out/Staticfile. root:public plus the
# nginx include keep trailing-slash redirects relative, so https is preserved
# behind the cloud.gov TLS router. Then run: cf push
---
applications:
  - name: semper-admin-portal
    memory: 128M
    disk_quota: 2G
    instances: 1
    path: out
    buildpacks:
      - staticfile_buildpack
    # No routes block. cf assigns semper-admin-portal.app.cloud.gov by default.
    # Confirm the hostname is free, or set an explicit route here.
